<!-- Incluimos el componente Navbar -->
<app-navbar></app-navbar>

<!-- Incluimos el componente Header -->
<app-header [titulo]="'Lista de Clientes - API - ' + modo()"></app-header>
<!-- <app-header titulo="Lista de Clientes - API - {{modo()}}"></app-header>  // equivalente -->

<!-- Contenido Principal de la Página -->
<main class="flex-grow-1">
    <div class="row py-3 mx-4">
        <div class="col-auto ms-3"><b>Cliente Seleccionado</b></div>
        <div class="col">{{empresaSeleccionada?.codigo | uppercase }} - {{ empresaSeleccionada?.nombre | uppercase}}</div>
        <!-- si mostramos la lista con una tabla de primeNG eliminamos el checkbox y usamos directamente el filtro del componente -->
        @if (modo()=='html') {
            <div class="col-2 text-end">
                <label>
                    <input type="checkbox" class="mx-1"  name="checkBajas" #checkBajas value=true [(ngModel)]="filtrarBajas">Filtrar Bajas
                </label>
            </div>
        }
    </div>        

    <div class="mt-1 px-2">
        @if (modo()=='html') {
            <app-lista-cliente-final [filtrarBajas]="filtrarBajas" (outEmpresaSeleccionada)="seleccionarEmpresa($event)"></app-lista-cliente-final>
        }
        @else {
            <app-lista-cliente-final-primeng [filtrarBajas]="filtrarBajas" (outEmpresaSeleccionada)="seleccionarEmpresa($event)"></app-lista-cliente-final-primeng>
        }
        
    </div>
</main>

<!-- Incluimos el componente Footer -->
<app-footer></app-footer>
