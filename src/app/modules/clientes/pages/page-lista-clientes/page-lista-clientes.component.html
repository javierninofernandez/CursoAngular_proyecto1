<!-- Incluimos el componente Navbar -->
<app-navbar></app-navbar>

<!-- Incluimos el componente Header -->
<app-header [titulo]="'Lista de Clientes'"></app-header>

<hr>
<div class="row mx-3">
    <div class="col">
        <div class="form-check form-check-inline">
            <input
                class="form-check-input"
                type="radio"
                name="inlineRadioOptions"
                id="inlineRadio1"
                [value]="false"
                [(ngModel)]="usarServicio">
            <label class="form-check-label" for="inlineRadio1">
                Ejemplo Inicial
            </label>
        </div>
        <div class="form-check form-check-inline">
            <input
                class="form-check-input"
                type="radio"
                name="inlineRadioOptions"
                id="inlineRadio2"
                [value]="true"
                [(ngModel)]="usarServicio">
            <label class="form-check-label" for="inlineRadio2">
                Uso Servicio básico
            </label>
        </div>
    </div>
</div>
<hr>

<!-- Contenido Principal de la Página -->
<main class="flex-grow-1">
    <div class="mt-1 px-2">
        @if (usarServicio) {
            <app-lista-cliente-2></app-lista-cliente-2>
        }
        @else {            
            <app-lista-cliente></app-lista-cliente>
        }        
    </div>
</main>

<!-- Incluimos el componente Footer -->
<app-footer></app-footer>
